name: Tests
on: [push, pull_request]
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.5.2
      - run: uv sync --locked --extra analysis --python ${{ matrix.python }}
      - run: uv run --locked --extra analysis pytest
      - run: uv run --locked python scripts/verify_model_artifacts.py
